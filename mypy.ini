[mypy]
python_version = 3.11
strict = true
files = src, tests

# The v12 runtime and its clock-patching tests are already pinned by saved
# comparison receipts. Python exposes the imported time module at runtime.
# Preserve those exact bytes and reflect that export for this version only;
# all implementation and test bodies retain strict type checking.
[mypy-spireshift.native_flow_session_v12]
implicit_reexport = true
