[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spireshift"
version = "0.1.0"
description = "Budgeted deliberation and patch-robust planning for Slay the Spire 2"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "SpireShift contributors" }]
dependencies = []

[project.scripts]
spireshift = "spireshift.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spireshift"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["spireshift"]
